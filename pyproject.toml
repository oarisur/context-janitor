[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "context-janitor"
version = "1.0.0rc1"
description = "Cost-saving CLI middleware for pruning oversized LLM agent tool catalogs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Context Janitor contributors" }]
keywords = [
  "llm",
  "agents",
  "tools",
  "tool-calling",
  "cost-saving",
  "openai",
  "anthropic",
  "gemini",
  "ai-agents",
  "middleware",
  "cli",
  "mcp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-asyncio",
]
dev = [
  "build",
  "pytest",
  "pytest-asyncio",
  "ruff",
  "mypy",
]

[project.urls]
Homepage = "https://github.com/oarisur/context-janitor"
Repository = "https://github.com/oarisur/context-janitor"
Issues = "https://github.com/oarisur/context-janitor/issues"
Documentation = "https://github.com/oarisur/context-janitor#readme"

[project.scripts]
context-janitor = "context_janitor.cli:main"
janitor = "context_janitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
context_janitor = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
