<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-label="Context Janitor heuristic flow">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
      .title { fill: #0f172a; font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; }
      .text { fill: #334155; font-family: Arial, Helvetica, sans-serif; font-size: 15px; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .accent-blue { fill: #e0f2fe; stroke: #0284c7; }
      .accent-green { fill: #dcfce7; stroke: #16a34a; }
      .accent-amber { fill: #fef3c7; stroke: #d97706; }
      .accent-rose { fill: #ffe4e6; stroke: #e11d48; }
    </style>
  </defs>
  <rect class="bg" width="980" height="420" rx="18"/>

  <rect class="card accent-blue" x="40" y="70" width="180" height="82" rx="12"/>
  <text class="title" x="70" y="106">User prompt</text>
  <text class="text" x="70" y="130">intent and wording</text>

  <rect class="card accent-green" x="40" y="250" width="180" height="82" rx="12"/>
  <text class="title" x="70" y="286">Tool catalog</text>
  <text class="text" x="70" y="310">names and descriptions</text>

  <rect class="card" x="290" y="62" width="220" height="100" rx="12"/>
  <text class="title" x="320" y="101">Tokenize prompt</text>
  <text class="text" x="320" y="126">split terms and expand</text>
  <text class="text" x="320" y="146">configured aliases</text>

  <rect class="card" x="290" y="242" width="220" height="100" rx="12"/>
  <text class="title" x="320" y="281">Tokenize tools</text>
  <text class="text" x="320" y="306">split names, descriptions,</text>
  <text class="text" x="320" y="326">and compound identifiers</text>

  <rect class="card accent-amber" x="585" y="150" width="190" height="100" rx="12"/>
  <text class="title" x="620" y="190">Score matches</text>
  <text class="text" x="620" y="215">rank each tool by</text>
  <text class="text" x="620" y="235">prompt relevance</text>

  <rect class="card accent-rose" x="820" y="150" width="120" height="100" rx="12"/>
  <text class="title" x="850" y="190">Top N</text>
  <text class="text" x="846" y="215">return the</text>
  <text class="text" x="844" y="235">best tools</text>

  <path class="arrow" d="M 220 111 H 290"/>
  <path class="arrow" d="M 220 291 H 290"/>
  <path class="arrow" d="M 510 112 C 555 112, 545 200, 585 200"/>
  <path class="arrow" d="M 510 292 C 555 292, 545 200, 585 200"/>
  <path class="arrow" d="M 775 200 H 820"/>
</svg>
