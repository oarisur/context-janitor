name: Context Janitor

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy src scripts
      - run: python -m pytest
      - run: janitor prune --prompt "Search GitHub issues" --tools examples/tools.json --limit 2
      - run: python scripts/evaluate.py --tools examples/tools.json --evals examples/evals.example.json --providers heuristic --limit 2
      - run: python scripts/eval_agent.py --tools examples/tools.json --evals examples/evals.example.json --providers heuristic --limit 2 -- python examples/agent_runner_mock.py
